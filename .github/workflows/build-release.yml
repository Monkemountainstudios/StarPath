name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: Starpath-Windows-x64
          - name: macOS Universal
            os: macos-14
            artifact: Starpath-macOS-Universal
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - name: Check out Starpath
        uses: actions/checkout@v4

      - name: Check out JUCE 9.0.1
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.1
          path: JUCE
          fetch-depth: 1

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSTARPATH_JUCE_SOURCE_DIR="${{ github.workspace }}/JUCE"

      - name: Configure macOS Universal
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DSTARPATH_JUCE_SOURCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --target StarpathDspTests Starpath_Standalone Starpath_VST3

      - name: Build macOS
        if: runner.os == 'macOS'
        run: cmake --build build --target StarpathDspTests Starpath_Standalone Starpath_VST3 Starpath_AU

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path "$packageRoot/Standalone", "$packageRoot/VST3" | Out-Null
          Copy-Item -LiteralPath "build/Starpath_artefacts/Release/Standalone/Starpath.exe" -Destination "$packageRoot/Standalone/"
          Copy-Item -LiteralPath "build/Starpath_artefacts/Release/VST3/Starpath.vst3" -Destination "$packageRoot/VST3/" -Recurse
          Copy-Item -LiteralPath "README.md", "CHANGELOG.md" -Destination $packageRoot
          Compress-Archive -Path $packageRoot -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          package_root="dist/${{ matrix.artifact }}"
          mkdir -p "$package_root/Standalone" "$package_root/VST3" "$package_root/AU"
          cp -R "build/Starpath_artefacts/Release/Standalone/Starpath.app" "$package_root/Standalone/"
          cp -R "build/Starpath_artefacts/Release/VST3/Starpath.vst3" "$package_root/VST3/"
          cp -R "build/Starpath_artefacts/Release/AU/Starpath.component" "$package_root/AU/"
          cp README.md CHANGELOG.md "$package_root/"
          ditto -c -k --keepParent "$package_root" "dist/${{ matrix.artifact }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: Starpath-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Starpath ${{ github.ref_name }}
          body_path: RELEASE-NOTES.md
          files: release-assets/*.zip
          fail_on_unmatched_files: true

